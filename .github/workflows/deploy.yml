name: Verify and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, lint and test
        run: npm run check
      - name: Install browser for integration tests
        run: npx playwright install --with-deps chromium
      - name: Configure Pages
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build static site
        run: npm run build
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      - name: Test production site in desktop and mobile browsers
        run: npm run test:e2e
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
